# ===========================================
# EXAMPLE CONFIGURATION FILE
# ===========================================
# Copy this file to application-local.properties
# and fill in your actual values
# ===========================================

# --- Database Configuration ---
spring.datasource.url=jdbc:postgresql://localhost:5432/jewelry_shop
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password

# --- JWT Configuration ---
# Generate a secure secret: openssl rand -base64 64
jwt.secret=YOUR_SUPER_SECRET_JWT_KEY_HERE
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# --- Google OAuth2 Configuration ---
# Get these from: https://console.cloud.google.com/apis/credentials
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET

# --- Email Configuration ---
# Gmail SMTP (recommended for development)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-gmail-app-password

# Email addresses
email.from=your-email@gmail.com
email.admin=admin@yourdomain.com

# --- Backup Configuration ---
backup.method=auto
backup.pg-dump.path=C:\\Program Files\\PostgreSQL\\15\\bin\\pg_dump.exe

# --- Payment Configuration ---
payment.stripe.secret-key=sk_test_your_stripe_secret_key
payment.paypal.client-id=your_paypal_client_id