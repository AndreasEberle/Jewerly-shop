# Production-specific configurations
# This file is .gitignored for security

# Production database (using environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Production JPA settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production logging
logging.level.andreas.kafkis.eberle.jewelry.shop.backend=INFO
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# Production security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Production actuator (limited endpoints)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Production storage (S3 or CDN)
storage.type=s3
storage.public-base-url=https://your-cdn.example.com/

# Production backup configuration
backup.schedule.enabled=true
backup.schedule.interval.minutes=60
backup.retention.count=24
backup.directory=/var/backups/jewelry-shop
backup.async.enabled=true

# Disable dev tools in production
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Production Flyway settings
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true