spring.application.name=Jewelry-shop-Backend

server.port=8080

# Set default profile to local for development
spring.profiles.active=local

# --- PostgreSQL DataSource ---
#Real credentials received from another file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL_FLAG}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL_FLAG}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=public

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true
# Remove/Comment out below for prod
spring.flyway.clean-disabled=true
#spring.flyway.clean-disabled=false

# --- Devtools ---
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# --- Media storage (local or s3) ---
storage.type=${STORAGE_TYPE:local}
# When type=local, absolute OS path where files live
storage.local.base-path=${STORAGE_LOCAL_BASE_PATH:}
# Public base URL used to serve media
# local example: http://localhost:8080/files/
# s3/cdn example: https://cdn.example.com/
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}

# --- Logging ---
logging.level.andreas.kafkis.eberle.jewelry.shop.backend=DEBUG
logging.level.org.springframework.web=DEBUG
logging.file.name=logs/jewelry-shop.log

# --- Metrics (Actuator) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# --- Backup Configuration ---
backup.directory=backups
backup.schedule.enabled=true
backup.schedule.interval.minutes=30
backup.retention.count=10
backup.async.enabled=true
# Backup method: auto (try pg_dump then JDBC), pg_dump (only pg_dump), jdbc (only JDBC)
backup.method=auto
# Optional: specify custom path to pg_dump.exe if not in PATH or standard locations
# backup.pg-dump.path=C:\\Program Files\\PostgreSQL\\15\\bin\\pg_dump.exe

# --- JWT Configuration ---
# Generate a secure secret key for production: openssl rand -base64 64
# NEVER commit real secrets to Git! Use environment variables or external config
jwt.secret=${JWT_SECRET:CHANGE_THIS_IN_PRODUCTION}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# --- OAuth2 Configuration ---
# Google OAuth2 - Create credentials at: https://console.cloud.google.com/
# NEVER commit real credentials to Git! Use environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:CHANGE_THIS_IN_PRODUCTION}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:CHANGE_THIS_IN_PRODUCTION}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=id

# --- Email Configuration ---
# SMTP Configuration (configure for your email provider)
# NEVER commit real credentials to Git! Use environment variables
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:CHANGE_THIS_IN_PRODUCTION}
spring.mail.password=${MAIL_PASSWORD:CHANGE_THIS_IN_PRODUCTION}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Email Templates
email.from=${EMAIL_FROM:noreply@jewelryshop.com}
email.admin=${EMAIL_ADMIN:admin@jewelryshop.com}