# Test Configuration Template
# ===========================================
# This is the template file for test configuration
# Copy this to application-test-real.properties and fill in your real values
# application-test-real.properties is gitignored and will NOT be pushed to git

spring.application.name=Jewelry-shop-Backend-Test

# Test database (H2 in-memory for fast tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Disable Flyway for tests (we use H2 with create-drop)
spring.flyway.enabled=false
spring.flyway.clean-disabled=false

# Disable SQL initialization (we use Hibernate create-drop + @Sql annotations)
spring.sql.init.mode=never

# Security configuration for tests
spring.security.user.name=test
spring.security.user.password=test

# JWT Configuration for tests
jwt.secret=test-secret-key-for-testing-only-not-for-production-use
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# OAuth2 Configuration for tests
# ===========================================
# For testing with real Google OAuth (uncomment and configure in application-test-real.properties):
# spring.security.oauth2.client.registration.google.client-id=your-google-client-id
# spring.security.oauth2.client.registration.google.client-secret=your-google-client-secret
# spring.security.oauth2.client.registration.google.scope=profile,email
# spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
# spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
# spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
# spring.security.oauth2.client.provider.google.user-name-attribute=id

# For testing with mocked OAuth (current setup):
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=id

# Email Configuration for tests
# ===========================================
# For testing with real SMTP (configure in application-test-real.properties):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-test-email@gmail.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
# spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# For testing with mocked SMTP (current setup):
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=localhost

# Email Templates - Configure test email addresses
email.from=test@jewelryshop.com
email.admin=admin@jewelryshop.com
# Email to receive test notifications
email.test-to=test@example.com

# Storage Configuration for tests
# ===========================================
# For testing with real S3 (configure in application-test-real.properties):
# storage.type=s3
# storage.s3.bucket-name=your-test-bucket-name
# storage.s3.region=us-east-1
# storage.s3.access-key=your-aws-access-key
# storage.s3.secret-key=your-aws-secret-key
# storage.public-base-url=https://your-test-bucket-name.s3.amazonaws.com/

# For testing with local storage (current setup):
storage.type=local
storage.local.base-path=target/test-files
storage.public-base-url=http://localhost:8080/files/

# Test Download Paths (moved to application-test-real.properties)

# Backup configuration for tests
backup.method=jdbc
backup.pg-dump.path=

# Allow circular references for tests
spring.main.allow-circular-references=true

# Logging for tests
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.andreas.kafkis.eberle.jewelry.shop.backend=DEBUG